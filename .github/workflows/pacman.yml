name: Gerar Pac-Man

on:
  schedule:
    - cron: "0 */12 * * *"

  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
      - name: Gerar Pac-Man
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: Vinicius-Rampazzo

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
